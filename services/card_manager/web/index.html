<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa"><title>卡密管理</title>
  <style>
    :root{--blue:#007aff;--bg:#f5f6fa;--ink:#172033;--muted:#667085;--line:#e4e7ec;--green:#128042;--orange:#c56a00;--red:#d70015}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer;transition:opacity .16s,transform .16s}button:active{transform:scale(.98)}button:disabled{cursor:default;opacity:.58}.app{max-width:680px;margin:auto;padding:10px 10px 166px}.top{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 13px;box-shadow:0 1px 1px #10182805}h1{font-size:21px;letter-spacing:-.6px;margin:0 0 2px}.sub,.sync-time{color:var(--muted);font-size:11px}.header-status{text-align:right}.sync-time{margin-top:4px;padding-right:2px}.online{color:#087a36;background:#e8f7ee;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:800}.groups{display:flex;gap:6px;overflow-x:auto;padding:8px 1px 7px}.group,.chip{white-space:nowrap;color:#344054;background:#fff;border:1px solid #d6dbe5;border-radius:10px;padding:6px 9px;font-size:12px}.group.active,.chip.active{border-color:var(--blue);color:#fff;background:var(--blue)}.dot{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:99px;background:#35cb77;box-shadow:0 0 0 2px #dbf8e6}.search-row{display:flex;gap:6px}.search{flex:1;min-width:0;border:1px solid #d3d8e2;background:#fff;border-radius:11px;padding:9px 11px;outline-color:var(--blue)}.search-action{white-space:nowrap;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}.search-submit,.copy{background:var(--blue);color:#fff}.search-clear{background:#fff;color:#475467;border:1px solid #d6dbe5}.filters,.quick-actions{display:flex;gap:6px;overflow:auto;padding:7px 1px}.chip,.quick-actions button{padding:7px 10px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 9px}.summary>div{padding:8px 10px;background:#eaf5ff;border:1px solid #cfe7fb;border-radius:12px;color:#34516c;font-size:11px}.summary strong{display:block;color:#12558d;font-size:17px;margin-top:1px}.section-head,.bulk{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-head{font-weight:800;margin:2px 1px 8px}.count{font-size:12px;color:var(--muted);font-weight:600}.bulk{margin:0 1px 10px}.choose{display:flex;align-items:center;gap:6px;color:#475467;font-size:12px;font-weight:700}.choose input{width:17px;height:17px;accent-color:var(--blue)}.copy{border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800}.copy:disabled{background:#d5dae3;color:#7b8494}.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:0 1px 1px #10182805}.card.duplicate{background:#fff4f5;border-color:#ffd4da}.card-top,.actions{display:flex;justify-content:space-between;gap:9px;align-items:center}.status{font-weight:800}.status.normal{color:#1676d2}.status.stocked{color:var(--green)}.status.redeemed{color:var(--orange)}.status.invalid{color:var(--red)}.code{margin:8px 0;font:600 15px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.meta{color:var(--muted);font-size:12px;line-height:1.65}.action-group{display:flex;gap:7px}.action{background:#eef6ff;color:#006fdc;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800}.note{background:#fff8d8;color:#665d00}.empty{padding:25px 15px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px}.dialog{border:0;border-radius:17px;padding:0;width:min(92vw,440px);box-shadow:0 18px 60px #10182855}.dialog::backdrop{background:#10182866}.dialog-box{padding:16px;background:#fff}.dialog h2{font-size:17px;margin:0 0 12px}.dialog textarea{width:100%;min-height:100px;border:1px solid #d3d8e2;border-radius:10px;padding:10px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.secondary{background:#eff1f5;border-radius:10px;padding:9px 13px}.primary{background:var(--blue);color:#fff;border-radius:10px;padding:9px 13px}.image{display:block;width:100%;max-height:70vh;object-fit:contain;background:#1c1c1e}.image-message{padding:34px;text-align:center;color:var(--muted)}.quick-actions{padding:0 1px 12px}.quick-actions button{white-space:nowrap;background:#fff;border:1px solid #d6dbe5;border-radius:10px;font-size:12px;font-weight:700}.quick-actions .rule-button{color:#006fdc;background:#eef6ff;border-color:#cce4ff}.quick-actions [data-field="stocked"][data-value="true"],.quick-actions [data-field="invalid"][data-value="false"]{color:#0a7a45;background:#ecf9f1;border-color:#b8e6cd}.quick-actions [data-field="redeemed"][data-value="true"]{color:#a85b00;background:#fff6e5;border-color:#f2d49a}.quick-actions [data-field="invalid"][data-value="true"]{color:#d70015;background:#fff5f6;border-color:#f5b7c0}.undo-status{color:#a85b00!important;background:#fff6e5!important;border-color:#f2d49a!important}.floating-actions{position:fixed;right:max(18px,calc((100vw - 680px)/2 + 16px));bottom:20px;display:grid;gap:8px;z-index:5}.floating-copy,.floating-delete{border-radius:99px;padding:11px 15px;box-shadow:0 8px 24px #10182833;font-weight:800}.floating-copy{background:#007aff;color:#fff}.floating-delete{background:#fff0f1;color:#c90018;border:1px solid #ffb8c1}.floating-copy:disabled,.floating-delete:disabled{background:#d5dae3;color:#7b8494}.rule-input{width:100%;border:1px solid #d3d8e2;border-radius:10px;padding:10px;outline-color:#007aff}.rule-list{max-height:180px;overflow:auto;margin-top:12px;color:#475467;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.8}.note-preview{margin:9px 0 2px;padding:7px 9px;background:#fff8d8;color:#665d00;border-radius:9px;font-size:12px;line-height:1.45;word-break:break-word}.image-card-editor{margin-top:13px;padding:12px;background:#f5f9ff;border:1px solid #cce4ff;border-radius:12px}.image-card-editor label{display:block;margin-bottom:7px;color:#075eab;font-size:13px;font-weight:800}.image-card-editor .hint{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.45}.list-tools{display:flex;align-items:center;gap:7px}.sort-time{white-space:nowrap;color:#006fdc;background:#eef6ff;border:1px solid #cce4ff;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:800}.denomination-actions{display:grid;justify-items:end;gap:5px}.denomination{padding:4px 8px;border-radius:8px;font-weight:800}.denom-11200{background:#e4f2ff;color:#075eab}.denom-5500{background:#fff0dd;color:#9a5200}.copy-one{background:#eef6ff;color:#006fdc;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><h1>卡密管理</h1><div class="sub">实时同步 · 独立管理端</div></div><div class="header-status"><div class="online" id="connection">● 正在同步</div><div class="sync-time" id="lastSync">上次同步：—</div><div class="sync-time" id="health">健康状态：等待同步</div></div></header>
  <nav class="groups" id="groups"></nav>
  <div class="search-row"><input id="search" class="search" placeholder="输入卡密、群名或用户"><button class="search-action search-submit" id="searchButton">搜索</button><button class="search-action search-clear" id="clearSearch">清空</button></div>
  <div class="filters" id="filters"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="unread">未读</button><button class="chip" data-filter="redeemed">已兑换</button><button class="chip" id="refresh">刷新</button></div>
  <section class="summary" id="summary"></section>
  <div class="section-head"><span>卡密列表</span><div class="list-tools"><button class="sort-time" id="sortTime">时间：新→旧</button><span class="count" id="total"></span></div></div>
  <div class="bulk"><label class="choose"><input type="checkbox" id="selectAll"> 全选当前</label><button class="copy" id="copySelected" disabled>复制已选卡密</button></div>
  <div class="quick-actions" id="quickActions"><button data-field="denomination" data-value="11200">设11200</button><button data-field="denomination" data-value="5500">设5500</button><button id="customDenomination">设置自定义面额</button><button data-field="stocked" data-value="true">标记入库</button><button data-field="redeemed" data-value="true">标记已兑换</button><button data-field="invalid" data-value="true">标记无效</button><button data-field="invalid" data-value="false">恢复正常</button><button class="undo-status" id="undoStatus" hidden>撤销操作</button><button class="rule-button" id="openRules">PUBG前缀规则</button></div>
  <section class="cards" id="cards"></section>
</main>
<div class="floating-actions"><button class="floating-delete" id="deleteSelectedBottom" disabled>删除已选</button><button class="floating-copy" id="copySelectedBottom" disabled>复制已选</button></div>
<dialog class="dialog" id="noteDialog"><div class="dialog-box"><h2>编辑备注</h2><textarea id="noteInput" maxlength="300" placeholder="填写备注"></textarea><div class="dialog-actions"><button class="secondary" id="cancelNote">取消</button><button class="primary" id="saveNote">保存</button></div></div></dialog>
<dialog class="dialog" id="imageDialog"><div class="dialog-box"><h2>原始图片</h2><img id="image" class="image" alt="原始图片"><div id="imageMessage" class="image-message" hidden>原始图片缓存已过期（仅保留当天）</div><div class="image-card-editor"><label for="imageCardInput">修改后卡密</label><input class="rule-input" id="imageCardInput" autocomplete="off" placeholder="对照图片输入正确卡密"><div class="hint">仅修改管理端这条记录，不影响机器人或 OCR。</div><div class="dialog-actions"><button class="secondary" id="closeImage">关闭</button><button class="primary" id="saveImageCard">保存修改</button></div></div></div></dialog>
<dialog class="dialog" id="rulesDialog"><div class="dialog-box"><h2>PUBG 前缀规则</h2><div class="sub">仅 PUBG 支持前缀规则：11200=S07368,S07362。PSN 面额请手动设置。</div><input class="rule-input" id="ruleInput" placeholder="11200=S07368,S07362"><div class="dialog-actions"><button class="secondary" id="closeRules">取消</button><button class="primary" id="saveRules">保存规则</button></div><div class="rule-list" id="ruleList">正在加载…</div></div></dialog>
<script>
  let records=[],selected=new Set(),currentGroup=null,currentFilter='all',appliedSearch='',sortDirection='desc',editing=null,viewingId=null,statusUndo=null,statusUndoDeadline=0,statusUndoTimer=null,syncVersion=0,liveSocket=null,liveRetry=0,reloadPromise=null,reloadQueued=false,reloadTimer=null,searchTimer=null,dayOffset=0;
  const $=s=>document.querySelector(s),groups=$('#groups'),cardsEl=$('#cards'),filters=$('#filters'),search=$('#search'),selectAll=$('#selectAll'),copySelected=$('#copySelected'),undoStatus=$('#undoStatus'),floatingCopy=$('#copySelectedBottom'),floatingDelete=$('#deleteSelectedBottom');
  async function api(path,options={}){const response=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},...options});if(response.status===401){location.replace('/login');throw new Error('登录已失效');}if(!response.ok)throw new Error(await response.text());return response.headers.get('content-type')?.includes('application/json')?response.json():response;}
  const text=value=>String(value??'');
  function displayTime(value){const raw=text(value).trim();if(!raw)return '';const iso=/(?:Z|[+-]\d\d:\d\d)$/.test(raw)?raw:raw.replace(' ','T')+'Z';const date=new Date(iso);if(Number.isNaN(date.getTime()))return raw.replace(/^\d{4}-/,'').replace('T',' ');const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));return `${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;}
  function beijingDay(value){const raw=value instanceof Date?'':text(value).trim(),iso=value instanceof Date?value:/(?:Z|[+-]\d\d:\d\d)$/.test(raw)?raw:raw.replace(' ','T')+'Z',date=value instanceof Date?value:new Date(iso);if(Number.isNaN(date.getTime()))return '';const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));return `${parts.year}-${parts.month}-${parts.day}`;}
  const selectedDay=()=>beijingDay(new Date(Date.now()+dayOffset*86400000));
  const inSelectedDay=record=>beijingDay(record.telegram_message_date)===selectedDay();
  function status(r){if(r.is_invalid)return ['● 无效','invalid'];if(r.is_redeemed)return ['● 已兑换','redeemed'];if(r.is_stocked)return ['✓ 已入库','stocked'];if(r.is_duplicate)return ['⚠ 重复','invalid'];return ['正常','normal'];}
  function setConnection(online){const node=$('#connection');node.textContent=online?'● 管理端在线':'● 同步失败';node.style.color=online?'':'#d70015';node.style.background=online?'':'#fff0f1';}
  function setLastSync(){const d=new Date();$('#lastSync').textContent=`上次同步：${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
  const palette=[['#e4f2ff','#075eab'],['#fff0dd','#9a5200'],['#f0e8ff','#6b3fa0'],['#e3f8f5','#08766c'],['#ffeaf1','#a13f64'],['#fff6d9','#836400']];
  function denominationStyle(value){const label=text(value).toUpperCase();if(label==='未分类')return 'background:#fff5f6;color:#c2293d';const index=label==='11200'?0:label==='5500'?1:[...label].reduce((n,ch)=>n+ch.charCodeAt(0),0)%palette.length,colors=palette[index];return `background:${colors[0]};color:${colors[1]}`;}
  function groupName(record){return text(record.display_user_name).trim()==='本人'?'机器人':text(record.display_chat_name||record.telegram_chat_title).trim();}
  function groupKey(record){const name=groupName(record);return name?`name:${name.toLocaleLowerCase()}`:`chat:${Number(record.telegram_chat_id)||0}`;}
  function pubgPrefix(card){const match=text(card).trim().toUpperCase().match(/^(S07[A-Z0-9]{3})/);return match?match[1]:null;}
  function setHealth(health={}){const latest=displayTime(health.last_valid_card_at)||'暂无';$('#health').textContent=`有效卡密：${latest}　今日新增：${Number(health.today_new||0)}`;}
  function visible(){const query=appliedSearch;return records.filter(r=>{const denomination=text(r.denomination)||'未分类',byDay=inSelectedDay(r),byGroup=currentGroup===null||groupKey(r)===currentGroup,unread=!r.is_viewed&&!r.is_stocked,byFilter=currentFilter==='all'||currentFilter==='unread'&&unread||currentFilter==='redeemed'&&r.is_redeemed||currentFilter.startsWith('denom:')&&(denomination===currentFilter.slice(6)||denomination==='未分类');return byDay&&byGroup&&byFilter&&(!query||`${text(r.final_card)} ${text(r.display_chat_name)} ${text(r.display_user_name)}`.toLowerCase().includes(query));}).sort((a,b)=>{const result=text(a.telegram_message_date).localeCompare(text(b.telegram_message_date))||Number(a.id)-Number(b.id);return sortDirection==='desc'?-result:result;});}
  function renderGroups(){const daily=records.filter(inSelectedDay),counts=new Map();daily.forEach(r=>{const key=groupKey(r),old=counts.get(key)||{name:groupName(r)||'未命名群',count:0,unread:0};old.count++;old.unread+=r.is_viewed?0:1;counts.set(key,old);});groups.innerHTML=`<button class="group ${currentGroup===null?'active':''}" data-group="">全部卡密 ${daily.length}</button>`+[...counts].sort((a,b)=>b[1].count-a[1].count||a[1].name.localeCompare(b[1].name,'zh')).map(([key,g])=>`<button class="group ${currentGroup===key?'active':''}" data-group="${encodeURIComponent(key)}">${g.unread?'<span class="dot"></span>':''}${g.name} ${g.count}${g.unread?' · 未读'+g.unread:''}</button>`).join('');groups.querySelectorAll('button').forEach(b=>b.onclick=()=>{currentGroup=b.dataset.group===''?null:decodeURIComponent(b.dataset.group);render();});}
  function updateBulk(list=visible()){const ids=list.map(r=>Number(r.id));selectAll.checked=ids.length>0&&ids.every(id=>selected.has(id));selectAll.indeterminate=ids.some(id=>selected.has(id))&&!selectAll.checked;const enabled=selected.size>0;copySelected.disabled=!enabled;floatingCopy.disabled=!enabled;floatingDelete.disabled=!enabled;copySelected.textContent=enabled?`复制已选卡密（${selected.size}）`:'复制已选卡密';floatingCopy.textContent=enabled?`复制已选（${selected.size}）`:'复制已选';floatingDelete.textContent=enabled?`删除已选（${selected.size}）`:'删除已选';}
  async function copyCodes(codes){const value=codes.join('\n');try{await navigator.clipboard.writeText(value);}catch(_){const box=document.createElement('textarea');box.value=value;box.style.cssText='position:fixed;opacity:0';document.body.append(box);box.select();document.execCommand('copy');box.remove();}}
  async function withBusy(button,busy,operation){if(!button||button.dataset.busy==='1')return;const original=button.textContent;button.dataset.busy='1';button.disabled=true;button.textContent=busy;try{return await operation();}finally{button.dataset.busy='';button.disabled=false;button.textContent=original;}}
  function applyRecord(updated){const id=Number(updated.id);records=records.map(row=>Number(row.id)===id?updated:row);}
  function render(){const list=visible(),scoped=records.filter(r=>inSelectedDay(r)&&(currentGroup===null||groupKey(r)===currentGroup)),counts=new Map();scoped.forEach(r=>counts.set(text(r.denomination)||'未分类',(counts.get(text(r.denomination)||'未分类')||0)+1));filters.innerHTML=[['all','全部'],['unread','未读'],...[...counts.keys()].sort((a,b)=>a.localeCompare(b,'zh')).map(v=>[`denom:${v}`,v])].map(([key,label])=>`<button class="chip ${currentFilter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')+`<button class="chip" id="todayCards">${dayOffset===0?'今日卡密':'回到今日'}</button><button class="chip" id="previousDay">前一日</button><button class="chip" id="refresh">刷新</button>`;$('#summary').innerHTML=[...counts].sort((a,b)=>a[0].localeCompare(b[0],'zh')).map(([denomination,count])=>`<div><span style="display:inline-block;padding:3px 6px;border-radius:7px;font-weight:800;${denominationStyle(denomination)}">${denomination}</span><strong>${count} 张</strong></div>`).join('');$('#total').textContent=`${selectedDay()} · 共 ${list.length} 条`;cardsEl.innerHTML=list.map(r=>{const [label,cls]=status(r),group=text(r.display_user_name)==='本人'?'':text(r.display_chat_name),date=displayTime(r.telegram_message_date),note=text(r.manual_note).trim();return `<article class="card ${r.is_duplicate?'duplicate':''}" data-card="${r.id}"><div class="card-top"><span class="status ${cls}">${!r.is_viewed&&!r.is_stocked?'<span class="dot"></span>':''}${label}</span><div class="denomination-actions"><span class="count denomination" style="${denominationStyle(r.denomination)}">${text(r.denomination)}</span><button class="copy-one" data-copy-one="${r.id}">复制</button></div></div><div class="code">${text(r.final_card)}</div><div class="meta">${group}${group&&r.display_user_name?' · ':''}${text(r.display_user_name)}　${date}</div>${note?`<div class="note-preview">备注：${note}</div>`:''}<div class="actions"><label class="choose"><input type="checkbox" data-select="${r.id}" ${selected.has(Number(r.id))?'checked':''}>选择</label><div class="action-group"><button class="action" data-image="${r.id}">查看原图</button><button class="action note" data-note="${r.id}">备注</button></div></div></article>`;}).join('')||'<div class="empty">没有符合条件的卡密</div>';cardsEl.querySelectorAll('[data-select]').forEach(box=>box.onchange=()=>{const id=Number(box.dataset.select);box.checked?selected.add(id):selected.delete(id);updateBulk(list);});cardsEl.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>showImage(Number(b.dataset.image)));cardsEl.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>openNote(Number(b.dataset.note)));cardsEl.querySelectorAll('[data-copy-one]').forEach(b=>b.onclick=()=>withBusy(b,'已复制',async()=>{const r=records.find(row=>Number(row.id)===Number(b.dataset.copyOne));if(r)await copyCodes([text(r.final_card)]);}));cardsEl.querySelectorAll('[data-card]').forEach(card=>card.onclick=e=>{if(e.target.closest('button,label,input'))return;markViewed(Number(card.dataset.card));});updateBulk(list);renderGroups();}
  function scheduleReload(delay=250){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>reload(),delay);}
  async function reload(){if(reloadPromise){reloadQueued=true;return reloadPromise;}reloadPromise=(async()=>{try{const data=await api('records?limit=10000');records=data.records||[];syncVersion=Math.max(syncVersion,Number(data.version)||0);const known=new Set(records.map(r=>Number(r.id)));selected=new Set([...selected].filter(id=>known.has(id)));setConnection(true);setLastSync();setHealth(data.health||{});render();}catch(error){setConnection(false);console.error(error);}})();try{await reloadPromise;}finally{reloadPromise=null;if(reloadQueued){reloadQueued=false;scheduleReload(0);}}}
  function connectLive(){if(liveSocket&&[WebSocket.CONNECTING,WebSocket.OPEN].includes(liveSocket.readyState))return;const protocol=location.protocol==='https:'?'wss':'ws';liveSocket=new WebSocket(`${protocol}://${location.host}/ws?after_version=${syncVersion}`);liveSocket.onmessage=()=>scheduleReload(220);liveSocket.onopen=()=>{liveRetry=0;setConnection(true);};liveSocket.onclose=()=>{liveSocket=null;if(!document.hidden){const delay=Math.min(30000,1000*2**liveRetry++);setTimeout(connectLive,delay);}};liveSocket.onerror=()=>liveSocket?.close();}
  async function markViewed(id){const r=records.find(row=>Number(row.id)===id);if(!r||r.is_viewed)return;r.is_viewed=1;render();try{applyRecord(await api(`records/${id}`,{method:'PATCH',body:JSON.stringify({viewed:true})}));}catch(_){scheduleReload(0);}}
  async function showImage(id){viewingId=id;const r=records.find(row=>Number(row.id)===id);if(r)markViewed(id);const image=$('#image'),message=$('#imageMessage');$('#imageCardInput').value=text(r?.final_card);message.hidden=true;image.hidden=false;image.src=`/api/records/${id}/image?preview=true&t=${Date.now()}`;image.onerror=()=>{image.hidden=true;message.hidden=false;};$('#imageDialog').showModal();}
  function openNote(id){editing=records.find(r=>Number(r.id)===id);$('#noteInput').value=text(editing?.manual_note);$('#noteDialog').showModal();}
  function clearStatusUndo(){statusUndo=null;statusUndoDeadline=0;if(statusUndoTimer)clearInterval(statusUndoTimer);statusUndoTimer=null;undoStatus.hidden=true;}
  function renderStatusUndo(){const remaining=Math.max(0,Math.ceil((statusUndoDeadline-Date.now())/1000));if(!statusUndo||remaining<=0){clearStatusUndo();return;}undoStatus.hidden=false;undoStatus.textContent=`撤销（${remaining}s）`;}
  function offerStatusUndo(snapshot){if(!snapshot.length)return;statusUndo=snapshot;statusUndoDeadline=Date.now()+8000;if(statusUndoTimer)clearInterval(statusUndoTimer);statusUndoTimer=setInterval(renderStatusUndo,250);renderStatusUndo();}
  async function batchUpdate(field,value){const ids=[...selected];if(!ids.length){alert('请先勾选要操作的卡密。');return;}const chosen=records.filter(r=>ids.includes(Number(r.id))),snapshot=['stocked','redeemed','invalid'].includes(field)?chosen.map(r=>({id:Number(r.id),stocked:!!r.is_stocked,redeemed:!!r.is_redeemed,invalid:!!r.is_invalid})):[],automaticRules=field==='denomination'&&['11200','5500'].includes(text(value).trim())?[...new Set(chosen.map(r=>pubgPrefix(r.final_card)).filter(Boolean))]:[];chosen.forEach(r=>{if(field==='denomination')r.denomination=text(value);else{r[`is_${field}`]=value;if(field==='redeemed'&&value)r.is_stocked=false;}});selected.clear();render();offerStatusUndo(snapshot);try{const updated=await api('records/batch',{method:'PATCH',body:JSON.stringify({record_ids:ids,[field]:value})});(updated||[]).forEach(applyRecord);if(automaticRules.length)await Promise.all(automaticRules.map(prefix=>api('denomination-rules',{method:'PUT',body:JSON.stringify({prefix,denomination:text(value).trim()})})));if(automaticRules.length)scheduleReload(120);}catch(error){scheduleReload(0);throw error;}}
  undoStatus.onclick=()=>withBusy(undoStatus,'正在撤销…',async()=>{if(!statusUndo||Date.now()>=statusUndoDeadline){clearStatusUndo();return;}const snapshot=statusUndo;clearStatusUndo();snapshot.forEach(old=>{const r=records.find(row=>Number(row.id)===old.id);if(r)Object.assign(r,{is_stocked:old.stocked,is_redeemed:old.redeemed,is_invalid:old.invalid});});render();try{await Promise.all(snapshot.map(old=>api(`records/${old.id}`,{method:'PATCH',body:JSON.stringify({stocked:old.stocked,redeemed:old.redeemed,invalid:old.invalid})})));}catch(_){alert('撤销失败，已恢复服务器当前状态。');scheduleReload(0);}});
  function parseRule(raw){const parts=raw.replace('＝','=').split('='),denomination=parts.shift()?.trim(),prefixes=(parts.join('=').match(/[^,，/;；\s]+/g)||[]).map(v=>v.toUpperCase());if(parts.length===0||!denomination||!prefixes.length||prefixes.some(v=>!v.startsWith('S07')))throw new Error('仅 PUBG 前缀规则，格式示例：11200=S07368,S07362');return {denomination,prefixes:[...new Set(prefixes)]};}
  async function loadRules(){const list=$('#ruleList');try{const result=await api('denomination-rules');list.textContent=(result.rules||[]).map(rule=>`${rule.denomination} = ${rule.prefix}`).join('\n')||'暂未设置规则';}catch(_){list.textContent='规则读取失败';}}
  filters.onclick=e=>{const today=e.target.closest('#todayCards');if(today){dayOffset=0;render();return;}const previous=e.target.closest('#previousDay');if(previous){dayOffset--;render();return;}const refresh=e.target.closest('#refresh');if(refresh){withBusy(refresh,'正在刷新…',reload);return;}const b=e.target.closest('[data-filter]');if(!b)return;currentFilter=b.dataset.filter;render();};$('#searchButton').onclick=()=>{clearTimeout(searchTimer);appliedSearch=search.value.trim().toLowerCase();render();};search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{appliedSearch=search.value.trim().toLowerCase();render();},180);};$('#clearSearch').onclick=()=>{clearTimeout(searchTimer);search.value='';appliedSearch='';render();search.focus();};search.onkeydown=e=>{if(e.key==='Enter')$('#searchButton').click();};$('#sortTime').onclick=()=>{sortDirection=sortDirection==='desc'?'asc':'desc';$('#sortTime').textContent=sortDirection==='desc'?'时间：新→旧':'时间：旧→新';render();};selectAll.onchange=()=>{visible().forEach(r=>selectAll.checked?selected.add(Number(r.id)):selected.delete(Number(r.id)));render();};copySelected.onclick=()=>withBusy(copySelected,'正在复制…',async()=>{await copyCodes(records.filter(r=>selected.has(Number(r.id))).map(r=>text(r.final_card)).filter(Boolean));});floatingCopy.onclick=()=>withBusy(floatingCopy,'正在复制…',async()=>copySelected.click());floatingDelete.onclick=()=>withBusy(floatingDelete,'正在删除…',async()=>{const ids=[...selected];if(!ids.length||!confirm(`确定删除已选的 ${ids.length} 张卡密吗？\n删除后无法恢复。`))return;records=records.filter(r=>!selected.has(Number(r.id)));selected.clear();render();try{await api('records/batch',{method:'DELETE',body:JSON.stringify({record_ids:ids})});}catch(_){alert('删除失败，已恢复服务器当前状态。');scheduleReload(0);}});$('#cancelNote').onclick=()=>$('#noteDialog').close();$('#closeImage').onclick=()=>$('#imageDialog').close();$('#saveImageCard').onclick=e=>withBusy(e.currentTarget,'正在保存…',async()=>{const card=$('#imageCardInput').value.trim().toUpperCase();if(viewingId===null||!card){alert('请输入卡密。');return;}try{applyRecord(await api(`records/${viewingId}`,{method:'PATCH',body:JSON.stringify({final_card:card})}));$('#imageDialog').close();render();}catch(_){alert('保存失败，请重试。');}});$('#saveNote').onclick=e=>withBusy(e.currentTarget,'正在保存…',async()=>{if(!editing)return;try{applyRecord(await api(`records/${editing.id}`,{method:'PATCH',body:JSON.stringify({note:$('#noteInput').value})}));$('#noteDialog').close();render();}catch(_){alert('保存失败，请重试。');}});$('#quickActions').onclick=e=>{const custom=e.target.closest('#customDenomination');if(custom){const value=prompt('输入自定义面额，例如：PSN500');if(value?.trim())withBusy(custom,'处理中…',()=>batchUpdate('denomination',value.trim()).catch(()=>alert('保存失败，请刷新后重试。')));return;}const b=e.target.closest('button[data-field]');if(b)withBusy(b,'处理中…',()=>batchUpdate(b.dataset.field,b.dataset.value==='true'?true:b.dataset.value).catch(()=>alert('保存失败，请刷新后重试。')));};$('#openRules').onclick=async()=>{$('#rulesDialog').showModal();await loadRules();};$('#closeRules').onclick=()=>$('#rulesDialog').close();$('#saveRules').onclick=e=>withBusy(e.currentTarget,'正在保存…',async()=>{try{const rule=parseRule($('#ruleInput').value.trim());for(const prefix of rule.prefixes)await api('denomination-rules',{method:'PUT',body:JSON.stringify({prefix,denomination:rule.denomination})});$('#ruleInput').value='';await loadRules();}catch(error){alert(error.message||'保存失败，请重试。');}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){reload();connectLive();}});reload();connectLive();
</script>
